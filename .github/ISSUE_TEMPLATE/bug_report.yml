name: Bug report
description: Report a reproducible problem with the extension
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem with the AdGuard Home
        Browser Assistant.

        **Remove cookies, session tokens, passwords, API keys, and private
        client IPs before submitting.** Redact anything sensitive.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem and what you expected instead.
      placeholder: When I ... the extension ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Shown in the extension Settings.
      placeholder: "1.1.0"
    validations:
      required: true

  - type: input
    id: firefox-version
    attributes:
      label: Firefox version
      description: From `about:support` or the Firefox menu.
      placeholder: "156.0.1"
    validations:
      required: true

  - type: input
    id: agh-version
    attributes:
      label: AdGuard Home version
      description: Shown at the bottom of the AdGuard Home dashboard.
      placeholder: "0.107.0"
    validations:
      required: true

  - type: input
    id: agh-url-type
    attributes:
      label: AdGuard Home URL type
      description: Direct, reverse proxy, custom port, etc.
      placeholder: Direct / reverse proxy / custom port
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Debian 13, Windows 11, macOS 15, ...
    validations:
      required: true

  - type: dropdown
    id: logged-in
    attributes:
      label: Is the AdGuard Home UI logged in in this Firefox profile?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: tried
    attributes:
      label: What did you already try?
      options:
        - label: Reloaded the AdGuard Home tab
        - label: Reloaded the extension
        - label: Checked the browser console for `[AGH Assistant]` messages
        - label: Waited ~10 s after unblocking and reloaded
        - label: Flushed the client DNS cache

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: |
        Paste relevant browser-console output. After submitting, you can drag
        screenshots into a comment. Remove cookies, tokens, passwords, and
        private client IPs first.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that helps reproduce the issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am using the latest available release.
          required: true
        - label: I removed cookies, session tokens, passwords, API keys, and private client IPs from this report.
          required: true
